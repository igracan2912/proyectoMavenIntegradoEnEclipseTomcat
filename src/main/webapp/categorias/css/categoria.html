
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edición de categoría</title>

    <!-- Bootstrap 5.3 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS propio -->
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="listado.html">
                Gestión de categorías
            </a>
        </div>
    </nav>

    <main class="container mt-4">

        <h1 class="h3 mb-4">Edición de categoría</h1>

        <div class="card shadow-sm">
            <div class="card-header bg-light">
                Datos de la categoría
            </div>

            <div class="card-body">

                <form action="#" method="post">

                    <div class="mb-3">
                        <label for="id" class="form-label">
                            ID
                        </label>

                        <input
                            type="number"
                            class="form-control campo-id"
                            id="id"
                            name="id"
                            value="1"
                            disabled>

                        <div class="form-text">
                            El identificador se asigna automáticamente.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="descripcion" class="form-label">
                            Descripción
                            <span class="text-danger">*</span>
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="descripcion"
                            name="descripcion"
                            value="Informática"
                            placeholder="Introduce la descripción"
                            maxlength="100"
                            required>

                        <div class="form-text">
                            Introduce una descripción de hasta 100 caracteres.
                        </div>
                    </div>

                    <hr>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            Guardar
                        </button>

                        <a href="listado.html"
                           class="btn btn-secondary">
                            Cancelar
                        </a>
                    </div>

                </form>

            </div>
        </div>

    </main>

    <footer class="container mt-5 mb-3 text-center text-muted">
        <small>Aplicación de ejemplo para prácticas de desarrollo web</small>
    </footer>

</body>
</html>
