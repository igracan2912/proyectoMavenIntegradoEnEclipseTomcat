
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de categorías</title>

    <!-- Bootstrap 5.3 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS propio -->
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="listado.html">
                Gestión de categorías
            </a>
        </div>
    </nav>

    <main class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">Listado de categorías</h1>

            <a href="edicion.html" class="btn btn-success">
                + Nueva categoría
            </a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">

                <div class="table-responsive">
                    <table id="tablaCategorias" class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th scope="col" class="col-id">ID</th>
                                <th scope="col">Descripción</th>
                                <th scope="col" class="text-end">Acciones</th>
                            </tr>
                        </thead>

                        <tbody>
                        </tbody>
                    </table>
                </div>

                <p class="text-muted mt-3 mb-0">
                    Total de categorías: 3
                </p>

            </div>
        </div>

        <div class="mt-3">
            <a href="../index.html" class="btn btn-outline-secondary">
                Volver al inicio
            </a>
        </div>

    </main>

    <footer class="container mt-5 mb-3 text-center text-muted">
        <small>Aplicación de ejemplo para prácticas de desarrollo web</small>
    </footer>


<script>
    // Crear el objeto XMLHttpRequest
    const xhr = new XMLHttpRequest();

    // Configurar la petición
    xhr.open(
        "GET",
        "http://localhost:8080/tutorial_Java2EE_SpringBoot/ej02_categorias",
        true
    );

    // Indicar que esperamos una respuesta JSON
 //   xhr.responseType = "json";

    // Procesar la respuesta
xhr.onload = function () {
    if (xhr.status >= 200 && xhr.status < 300) {

        // Convertir la respuesta JSON en un array de objetos
        const categorias = JSON.parse(xhr.responseText);
        
        // Obtener el cuerpo de la tabla
        const tbody = document.querySelector("#tablaCategorias tbody");

        // Vaciar las filas existentes
        tbody.innerHTML = "";

        // Recorrer las categorías recibidas
        categorias.forEach(categoria => {

            // Crear una fila
            const fila = document.createElement("tr");

            // Construir su contenido
            fila.innerHTML = `
                <td>${categoria.id}</td>
                <td>${categoria.descripcion}</td>
                <td class="text-end">
                    <a href="edicion.html?id=${categoria.id}"
                       class="btn btn-sm btn-primary">
                        Editar
                    </a>

                    <button type="button"
                            class="btn btn-sm btn-danger">
                        Eliminar
                    </button>
                </td>
            `;

            // Añadir la fila a la tabla
            tbody.appendChild(fila);
        });

        console.log("Categorías recibidas:", categorias);

    } else {
        console.error("Error HTTP:", xhr.status);
    }
};
    // Gestionar errores de conexión
    xhr.onerror = function () {
        console.error("Error de red al obtener las categorías");
    };

    // Enviar la petición AJAX
    xhr.send();
</script>

</body>
</html>
