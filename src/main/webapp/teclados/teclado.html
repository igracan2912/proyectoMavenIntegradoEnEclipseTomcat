<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Teclados - Formulario</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-5">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="teclados.html">
                <i class="bi bi-keyboard fs-4 text-primary"></i>
                <span>KeyManager DAW</span>
            </a>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <!-- Contenedor de Alertas -->
                <div id="alertContainer"></div>

                <div class="card card-custom">
                    <!-- Cabecera Dinámica -->
                    <div class="card-header-gradient d-flex justify-content-between align-items-center">
                        <div>
                            <h4 class="mb-1 fw-bold" id="formTitle">
                                <i class="bi bi-plus-circle me-2"></i>Nuevo Teclado
                            </h4>
                            <p class="mb-0 opacity-75 small" id="formSubtitle">
                                Completa los campos para registrar un teclado
                            </p>
                        </div>
                        <a href="teclados.html" class="btn btn-light btn-sm fw-medium shadow-sm">
                            <i class="bi bi-arrow-left me-1"></i> Volver
                        </a>
                    </div>

                    <div class="card-body p-4">
                        <!-- Spinner al cargar datos para editar -->
                        <div id="loadingForm" class="text-center py-4" style="display: none;">
                            <div class="spinner-border text-primary" role="status"></div>
                            <p class="mt-2 text-muted small">Cargando datos del teclado...</p>
                        </div>

                        <!-- Formulario -->
                        <form id="tecladoForm">
                            <!-- Campo ID (Visible solo en edición) -->
                            <div class="mb-3" id="grupoId" style="display: none;">
                                <label for="id" class="form-label fw-semibold text-secondary small text-uppercase">ID del Teclado</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-hash"></i></span>
                                    <input type="number" class="form-control bg-light" id="id" name="id" readonly>
                                </div>
                            </div>

                            <!-- Campo Color -->
                            <div class="mb-3">
                                <label for="color" class="form-label fw-semibold text-secondary small text-uppercase">Color <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-palette text-primary"></i></span>
                                    <input type="text" class="form-control" id="color" name="color" placeholder="Ej. Negro, Blanco RGB, Gris Espacial..." required>
                                </div>
                            </div>

                            <!-- Campo Idioma -->
                            <div class="mb-3">
                                <label for="idioma" class="form-label fw-semibold text-secondary small text-uppercase">Idioma / Distribución <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-translate text-primary"></i></span>
                                    <input type="text" class="form-control" id="idioma" name="idioma" placeholder="Ej. Español (ISO), Inglés (ANSI), Francés..." required>
                                </div>
                            </div>

                            <!-- Campo idCategoria -->
                            <div class="mb-4">
                                <label for="idCategoria" class="form-label fw-semibold text-secondary small text-uppercase">ID Categoría <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-tags text-primary"></i></span>
                                    <input type="number" class="form-control" id="idCategoria" name="idCategoria" placeholder="Introduce un número entero (Ej. 1, 2, 3...)" min="1" step="1" required>
                                </div>
                                <div class="form-text">El servlet requiere un valor numérico entero para la categoría.</div>
                            </div>

                            <!-- Botones -->
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end pt-2 border-top">
                                <a href="teclados.html" class="btn btn-light border px-4">Cancelar</a>
                                <button type="submit" class="btn btn-gradient px-4" id="btnGuardar">
                                    <i class="bi bi-check2-circle me-1"></i> Guardar Teclado
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const idParam = params.get('id');
        const modoEdicion = idParam !== null && idParam.trim() !== '';

        const form = document.getElementById('tecladoForm');
        const btnGuardar = document.getElementById('btnGuardar');

        document.addEventListener('DOMContentLoaded', () => {
            if (modoEdicion) {
                configurarModoEdicion(idParam);
            }
        });

        // 1. Configurar vista y cargar datos con GET teclados?id=X si estamos editando
        async function configurarModoEdicion(id) {
            document.getElementById('formTitle').innerHTML = `<i class="bi bi-pencil-square me-2"></i>Editar Teclado #${id}`;
            document.getElementById('formSubtitle').textContent = 'Modifica los parámetros del teclado seleccionado';
            document.getElementById('grupoId').style.display = 'block';
            btnGuardar.innerHTML = '<i class="bi bi-save me-1"></i> Actualizar Cambios';

            form.style.display = 'none';
            document.getElementById('loadingForm').style.display = 'block';

            try {
                const response = await fetch(`teclados?id=${encodeURIComponent(id)}`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || data.error || `No se encontró el teclado con ID ${id}`);
                }

                // Rellenar campos con las propiedades del objeto Teclado devuelto por el Servlet
                document.getElementById('id').value = data.id;
                document.getElementById('color').value = data.color;
                document.getElementById('idioma').value = data.idioma;
                document.getElementById('idCategoria').value = data.idCategoria;

                form.style.display = 'block';
            } catch (error) {
                mostrarAlerta(error.message, 'danger');
            } finally {
                document.getElementById('loadingForm').style.display = 'none';
            }
        }

        // 2. Enviar datos mediante POST (/teclados/crear) o PUT (/teclados/modificar)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const color = document.getElementById('color').value.trim();
            const idioma = document.getElementById('idioma').value.trim();
            const idCategoria = document.getElementById('idCategoria').value.trim();

            btnGuardar.disabled = true;
            btnGuardar.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Guardando...';

            try {
                let response;

                if (modoEdicion) {
                    // PUT: Enviamos los parámetros en la Query String para que request.getParameter() funcione en Tomcat
                    const queryParams = new URLSearchParams({
                        id: idParam,
                        color: color,
                        idioma: idioma,
                        idCategoria: idCategoria
                    });

                    response = await fetch(`teclados/modificar?${queryParams.toString()}`, {
                        method: 'PUT'
                    });
                } else {
                    // POST: Enviamos como application/x-www-form-urlencoded estándar
                    const bodyParams = new URLSearchParams({
                        color: color,
                        idioma: idioma,
                        idCategoria: idCategoria
                    });

                    response = await fetch('teclados/crear', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
                        },
                        body: bodyParams.toString()
                    });
                }

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.message || errData.error || 'Error al procesar la solicitud en el servidor');
                }

                // Redirigir al listado indicando la operación realizada
                window.location.href = `teclados.html?msg=${modoEdicion ? 'modificado' : 'creado'}`;

            } catch (error) {
                mostrarAlerta(error.message, 'danger');
                btnGuardar.disabled = false;
                btnGuardar.innerHTML = modoEdicion 
                    ? '<i class="bi bi-save me-1"></i> Actualizar Cambios' 
                    : '<i class="bi bi-check2-circle me-1"></i> Guardar Teclado';
            }
        });

        function mostrarAlerta(mensaje, tipo) {
            const container = document.getElementById('alertContainer');
            container.innerHTML = `
                <div class="alert alert-${tipo} alert-dismissible fade show shadow-sm border-0 mb-4" role="alert">
                    <i class="bi bi-exclamation-octagon-fill me-2"></i>
                    ${mensaje}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
        }
    </script>
</body>
</html>
