<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Libro</title>


<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

</head>


<body class="bg-light">


	<div class="container py-5">

		<div class="row justify-content-center">

			<div class="col-md-6">

				<div class="card shadow-sm">

					<div class="card-header">

						<h2 id="titulo" class="mb-0">Nuevo libro</h2>

					</div>


					<div class="card-body">


						<form id="formLibro">


							<div id="campoId" class="mb-3 d-none">

								<label for="id" class="form-label"> ID </label> <input
									type="text" id="id" class="form-control" readonly>

							</div>


							<div class="mb-3">

								<label for="titulo" class="form-label"> Titulo </label> <input
									type="text" id="titulo" name="titulo" class="form-control"
									required>

							</div>


							<div class="mb-3">

								<label for="anioPublicacion" class="form-label"> Año publicacion </label> <input
									type="number" id="anioPublicacion" name="anioPublicacion" class="form-control"
									min="0" required>

							</div>


							<div
								class="d-flex
                                    justify-content-between">


								<a href="libros.html" class="btn btn-secondary"> Volver </a>


								<button type="submit" class="btn btn-primary">Guardar</button>

							</div>


						</form>


						<div id="mensaje" class="alert mt-3 d-none"></div>


					</div>

				</div>

			</div>

		</div>

	</div>


	<script>

const URL_LIBROS = "libros";


/*
 * Comprobamos si la URL contiene ?id=...
 *
 * persona.html
 *      -> Crear
 *
 * persona.html?id=2
 *      -> Editar
 */
const parametros =
    new URLSearchParams(
        window.location.search
    );


const id =
    parametros.get("id");


/*
 * Si existe ID estamos trabajando
 * con una persona existente.
 */
if (id !== null) {

    prepararEdicion(id);

}


/*
 * Cargar un libro.
 */
async function prepararEdicion(id) {

    document.getElementById(
        "titulo"
    ).textContent = "Editar libro";


    document.getElementById(
        "campoId"
    ).classList.remove("d-none");


    document.getElementById(
        "id"
    ).value = id;


    try {

        /*
         * GET /ej01_personas?id=2
         */
        const respuesta =
            await fetch(
                `${URL_LIBROS}?id=${id}`
            );


        const xml =
            await respuesta.text();


        const documento =
            new DOMParser()
                .parseFromString(
                    xml,
                    "application/xml"
                );


        if (!respuesta.ok) {

            const mensaje =
                documento.querySelector("mensaje")
                    ?.textContent
                || "Libro no encontrado.";

            mostrarMensaje(
                mensaje,
                "danger"
            );

            return;
        }


        /*
         * Extraemos los datos del XML.
         */
        const libro =
            documento.querySelector(
                "libro"
            );


        const titulo =
        	libro.querySelector("titulo")
                .textContent;


        const anioPublicacion =
            libro.querySelector("anioPublicacion")
                .textContent;


        document.getElementById(
            "titulo"
        ).value = titulo;


        document.getElementById(
            "anioPublicacion"
        ).value = anioPublicacion;


    } catch (error) {

        console.error(error);

        mostrarMensaje(
            "No se ha podido conectar con el servidor.",
            "danger"
        );
    }
}


/*
 * Envío del formulario.
 */
document.getElementById(
    "formLibro"
).addEventListener(
    "submit",
    async function(event) {

        /*
         * Evitamos que el navegador
         * envíe el formulario directamente.
         */
        event.preventDefault();


        const titulo =
            document.getElementById(
                "titulo"
            ).value;


        const anioPublicacion =
            document.getElementById(
                "anioPublicacion"
            ).value;


        try {

            let respuesta;


            /*
             * CREAR
             *
             * POST /ej01_personas/crear
             */
            if (id === null) {

                const parametros =
                    new URLSearchParams();

                parametros.append(
                    "titulo",
                    titulo
                );

                parametros.append(
                    "anioPublicacion",
                    anioPublicacion
                );


                respuesta =
                    await fetch(
                        `${URL_LIBROS}/crear?${parametros}`,
                        {
                            method: "POST"
                        }
                    );

            }


            /*
             * MODIFICAR
             *
             * PUT /ej01_personas/modificar
             */
            else {

                const parametros =
                    new URLSearchParams();


                parametros.append(
                    "id",
                    id
                );

                parametros.append(
                    "titulo",
                    titulo
                );

                parametros.append(
                    "anioPublicacion",
                    anioPublicacion
                );


                respuesta =
                    await fetch(
                        `${URL_LIBROS}/modificar?${parametros}`,
                        {
                            method: "PUT"
                        }
                    );
            }


            /*
             * El Servlet devuelve XML.
             */
            const xml =
                await respuesta.text();


            const documento =
                new DOMParser()
                    .parseFromString(
                        xml,
                        "application/xml"
                    );


            if (!respuesta.ok) {

                const mensaje =
                    documento.querySelector(
                        "mensaje"
                    )?.textContent
                    || "Se ha producido un error.";


                mostrarMensaje(
                    mensaje,
                    "danger"
                );


                return;
            }


            /*
             * Leemos el mensaje del XML.
             */
            const mensaje =
                documento.querySelector(
                    "mensaje"
                ).textContent;


            mostrarMensaje(
                mensaje,
                "success"
            );


            /*
             * Volvemos al listado
             * después de un momento.
             */
            setTimeout(
                () => {
                    window.location.href =
                        "libros.html";
                },
                800
            );


        } catch (error) {

            console.error(error);

            mostrarMensaje(
                "No se ha podido conectar con el servidor.",
                "danger"
            );
        }

    }
);


function mostrarMensaje(
    texto,
    tipo
) {

    const mensaje =
        document.getElementById(
            "mensaje"
        );


    mensaje.textContent =
        texto;


    mensaje.className =
        `alert alert-${tipo} mt-3`;
}

</script>


</body>

</html>
